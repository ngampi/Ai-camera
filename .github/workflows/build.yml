name: Build AI Camera APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Android Project
        run: |

          mkdir -p app/src/main/java/com/example/aicamera

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AICamera"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.aicamera"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.aicamera"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")

              val camerax = "1.4.1"

              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="AI Camera"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/aicamera/MainActivity.kt <<'EOF'
          package com.example.aicamera

          import android.Manifest
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {

              private lateinit var previewView: PreviewView
              private var imageCapture: ImageCapture? = null

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) {
                          startCamera()
                      } else {
                          Toast.makeText(
                              this,
                              "Camera permission required",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  createInterface()

                  if (ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCamera()
                  } else {
                      permissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              private fun createInterface() {

                  val root = FrameLayout(this)

                  previewView = PreviewView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      implementationMode =
                          PreviewView.ImplementationMode.COMPATIBLE
                  }

                  root.addView(previewView)

                  val title = TextView(this).apply {
                      text = "AI CAMERA"
                      textSize = 22f
                      setTextColor(android.graphics.Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(20, 30, 20, 30)
                      setBackgroundColor(0x55000000)
                  }

                  val titleParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP
                  )

                  root.addView(title, titleParams)

                  val captureButton = Button(this).apply {
                      text = "CAPTURE PHOTO"
                      textSize = 16f
                      setOnClickListener {
                          takePhoto()
                      }
                  }

                  val buttonParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  ).apply {
                      bottomMargin = 45
                  }

                  root.addView(captureButton, buttonParams)

                  root.setBackgroundColor(android.graphics.Color.BLACK)

                  setContentView(root)
              }

              private fun startCamera() {

                  val cameraProviderFuture =
                      ProcessCameraProvider.getInstance(this)

                  cameraProviderFuture.addListener({

                      val cameraProvider = cameraProviderFuture.get()

                      val preview = Preview.Builder().build().also {
                          it.surfaceProvider = previewView.surfaceProvider
                      }

                      imageCapture = ImageCapture.Builder()
                          .setCaptureMode(
                              ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY
                          )
                          .setJpegQuality(100)
                          .build()

                      try {
                          cameraProvider.unbindAll()

                          cameraProvider.bindToLifecycle(
                              this,
                              CameraSelector.DEFAULT_BACK_CAMERA,
                              preview,
                              imageCapture
                          )

                      } catch (e: Exception) {
                          Toast.makeText(
                              this,
                              "Camera could not start: ${e.message}",
                              Toast.LENGTH_LONG
                          ).show()
                      }

                  }, ContextCompat.getMainExecutor(this))
              }

              private fun takePhoto() {

                  val capture = imageCapture ?: return

                  val name = "AICamera_${System.currentTimeMillis()}.jpg"

                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, name)
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(
                          MediaStore.Images.Media.RELATIVE_PATH,
                          "Pictures/AICamera"
                      )
                  }

                  val outputOptions =
                      ImageCapture.OutputFileOptions.Builder(
                          contentResolver,
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          values
                      ).build()

                  capture.takePicture(
                      outputOptions,
                      ContextCompat.getMainExecutor(this),

                      object : ImageCapture.OnImageSavedCallback {

                          override fun onImageSaved(
                              output: ImageCapture.OutputFileResults
                          ) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Photo saved successfully!",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }

                          override fun onError(
                              exception: ImageCaptureException
                          ) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Photo failed: ${exception.message}",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  )
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
